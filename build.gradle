plugins {
    id "idea"
    id "eclipse"
    id "maven-publish"
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'com.diffplug.spotless' version '7.0.2'
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }
}

repositories {
    mavenLocal()
    maven {
        name = 'Type-Omega'
        url = 'https://type-omega.github.io/maven/'
        content { includeGroup 'com.raishxn.gtna'; includeGroup 'com.gtinfinityascension'; includeGroup 'com.typeomega' }
    }
    mavenCentral()
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        name 'FirstDarkDev'
        url "https://maven.firstdark.dev/snapshots/"
    }
    maven { // Registrate
        url = "https://maven.tterrag.com/"
        content {
            // need to be specific here due to version overlaps
            includeGroup("com.tterrag.registrate")
        }
    }
    maven {
        // Patchouli, JEI
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        // Curse Forge File
        url "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        // EMI
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
    maven {
        url = "https://thedarkcolour.github.io/KotlinForForge/"
    }

}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }
java { sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17 }

legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    runs {
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
            sourceSet = sourceSets.main
            programArguments.addAll('--refresh-dependencies')
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
            // ./gradlew runClient -PquickPlay="New World" opens that save directly (smoke tests).
            if (project.hasProperty('quickPlay')) programArguments.addAll('--quickPlaySingleplayer', project.quickPlay)
        }
        server {
            server()
            sourceSet = sourceSets.main
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
            programArguments.addAll('--nogui', '--world', 'world-extra')
        }
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.main
            // The megastructure GameTests build structures of up to ~90k blocks each.
            jvmArguments.addAll('-Xmx12G')
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
            if (project.hasProperty('typeomega.shapeDump')) systemProperty('typeomega.shapeDump', project.property('typeomega.shapeDump'))
        }
        data {
            data()
            sourceSet = sourceSets.main
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll('--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath())
            programArguments.addAll('--existing-mod', 'gtceu')
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}
apply from: "$rootDir/gradle/scripts/spotless.gradle"

dependencies {
    // GTNA API (GTNASteamBalance) at compile time; GTNA is a required dependency at runtime.
    // -PgtnaApiJar=<path> compiles against a local GTNA build instead of the published one.
    if (project.hasProperty('gtnaApiJar')) compileOnly files(project.property('gtnaApiJar'))
    else modCompileOnly("com.raishxn.gtna:gtna:${gtna_version}") { transitive = false }

    // EN: Productive Bees only at dev runtime, so GameTests see the HV bee recipes (D-259).
    // PT: Productive Bees só no runtime de dev, para as GameTests verem as receitas de abelha do HV (D-259).
    // ZH: Productive Bees 仅用于开发运行时，使 GameTest 能检查 HV 蜜蜂配方（D-259）。
    if (project.findProperty('typeOmegaDevOptionalDependencies') == 'true') {
        modRuntimeOnly("maven.modrinth:productivebees:1.20.1-12.6.0")
        // EN: Ad Astra and its libraries, same files as the pack's lock, so the space recipes and fuel tags are tested.
        // PT: Ad Astra e as libs dele, os mesmos arquivos do lock do pack, para testar as receitas e tags de espaço.
        // ZH: Ad Astra 及其依赖库，与整合包锁定文件相同，用于测试太空配方与燃料标签。
        modRuntimeOnly("curse.maven:ad-astra-635042:8833730")
        modRuntimeOnly("curse.maven:botarium-704113:5486070")
        modRuntimeOnly("curse.maven:resourceful-config-714059:6231176")
        modRuntimeOnly("curse.maven:resourceful-lib-570073:5659871")
    }
    // EN: FTB Teams is in the pack, so it is at dev runtime too (same files as GTNA); -PtypeOmegaDevFtbTeams=false runs
    // the GameTests without it, to cover the solo path.
    // PT: O FTB Teams está no pack, então entra também no runtime de dev (mesmos arquivos do GTNA);
    // -PtypeOmegaDevFtbTeams=false roda as GameTests sem ele, para cobrir o caminho solo.
    // ZH: FTB Teams 属于整合包，因此开发运行时也加载（与 GTNA 相同的文件）；-PtypeOmegaDevFtbTeams=false 可在不加载它的
    // 情况下运行 GameTest，以覆盖单人路径。
    if (project.findProperty('typeOmegaDevFtbTeams') != 'false') {
        modRuntimeOnly("curse.maven:ftb-library-forge-404465:8226927")
        modRuntimeOnly("curse.maven:ftb-teams-forge-404468:7499810")
        modRuntimeOnly("curse.maven:architectury-api-419699:5137938")
    }
    // EN: Playtest-only mods, never in the pack manifest nor in the GameTests: FTB Chunks and AE2 Wireless Terminals
    // (universal terminal, Quantum Bridge Card). tools/run_client_full.sh sets -PtypeOmegaDevPlaytest=true.
    // PT: Mods só para teste no cliente, nunca no manifest do pack nem nas GameTests: FTB Chunks e AE2 Wireless
    // Terminals (terminal universal, Quantum Bridge Card). O tools/run_client_full.sh passa -PtypeOmegaDevPlaytest=true.
    // ZH: 仅用于客户端试玩的模组，绝不进入整合包清单或 GameTest：FTB Chunks 与 AE2 Wireless Terminals
    // （通用终端、量子桥卡）。tools/run_client_full.sh 会传入 -PtypeOmegaDevPlaytest=true。
    if (project.findProperty('typeOmegaDevPlaytest') == 'true') {
        modRuntimeOnly("curse.maven:ftb-chunks-forge-314906:8216874")
        modRuntimeOnly("curse.maven:applied-energistics-2-wireless-terminals-459929:7251206")
        modRuntimeOnly("curse.maven:curios-309927:6418456")
        modRuntimeOnly("curse.maven:cloth-config-348521:5729105")
    }
    modCompileOnly("curse.maven:ftb-library-forge-404465:8226927") { transitive = false }
    modCompileOnly("curse.maven:ftb-teams-forge-404468:7499810") { transitive = false }
    // EN: Without -PgtnaDevJar the dev runtime (and CI) uses the published GTNA, so the GameTests see the same mods.
    // PT: Sem -PgtnaDevJar o runtime de dev (e o CI) usa o GTNA publicado, para as GameTests verem os mesmos mods.
    // ZH: 未指定 -PgtnaDevJar 时，开发运行时（及 CI）使用已发布的 GTNA，使 GameTest 加载相同的模组。
    if (project.hasProperty('gtnaDevJar')) runtimeOnly files(project.property('gtnaDevJar'))
    else modRuntimeOnly("com.raishxn.gtna:gtna:${gtna_version}") { transitive = false }
    modRuntimeOnly("curse.maven:applied-energistics-2-223794:7148487") { transitive = false }
    modRuntimeOnly("curse.maven:guideme-1173950:7127447")
    modRuntimeOnly("curse.maven:glodium-957920:5226922")
    modRuntimeOnly("curse.maven:ex-pattern-provider-892005:7248944")

    // EN: Dev-only companions for playtesting together (-PmodernSpaceJar / -PmodernManipulatorJar); never shipped.
    // PT: Mods parceiros só para teste em conjunto (-PmodernSpaceJar / -PmodernManipulatorJar); nunca entram no jar.
    // ZH: 仅用于开发联测的配套模组（-PmodernSpaceJar / -PmodernManipulatorJar），不会打包发布。
    if (project.hasProperty('modernSpaceJar')) {
        runtimeOnly files(project.property('modernSpaceJar'))
        modRuntimeOnly("curse.maven:infiniverse-568341:4597298")
    }
    if (project.hasProperty('agronomicaDevJar')) runtimeOnly files(project.property('agronomicaDevJar'))
    if (project.hasProperty('modernManipulatorJar')) runtimeOnly files(project.property('modernManipulatorJar'))

    modImplementation("com.typeomega:typeomega-lib:${typeomegalib_version}") { transitive = false }

    compileOnly("org.jetbrains:annotations:26.0.1")

    // AE2 API is available for the upcoming MV integration. The other mod bridges
    // currently use registry IDs, so the mod core can compile without their full jars.
    modCompileOnly("curse.maven:applied-energistics-2-223794:7148487") { transitive = false }
    // EN: ExtendedAE only at compile time: the tiered ME Interfaces reuse its 36-slot interface menu, screen and block
    // EN: entity (D-442); the pack ships the mod and the classes are only touched when it is loaded.
    // PT: ExtendedAE só na compilação: as ME Interface escalonadas reaproveitam o menu, a tela e a block entity de 36
    // PT: slots dele (D-442); o pack traz o mod e as classes só são tocadas quando ele está carregado.
    // ZH: ExtendedAE 仅用于编译：分级 ME 接口复用其 36 槽菜单、界面与方块实体（D-442）；整合包自带该模组，
    // ZH: 仅在其加载时才会访问这些类。
    modCompileOnly("curse.maven:ex-pattern-provider-892005:7248944") { transitive = false }
    modCompileOnly("curse.maven:glodium-957920:5226922") { transitive = false }
    // EN: Ad Astra's planet API for the Moon gate mixin (D-420); the pack ships the mod, the mixin is pseudo.
    // PT: API de planetas do Ad Astra para o mixin que trava a Lua (D-420); o pack traz o mod, o mixin é pseudo.
    // ZH: 用于登月限制 mixin 的 Ad Astra 星球 API（D-420）；整合包自带该模组，mixin 为 pseudo。
    modCompileOnly("curse.maven:ad-astra-635042:8833730") { transitive = false }

    // JEI, EMI, Jade
    modCompileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    modRuntimeOnly("dev.emi:emi-forge:${emi_version}+${minecraft_version}")
    modCompileOnly("dev.emi:emi-forge:${emi_version}+${minecraft_version}:api")
    modRuntimeOnly("curse.maven:jade-324717:5390389")

    // GregTech and dependencies
    modImplementation("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim") { transitive = false }
    modImplementation("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
    modImplementation("dev.toma.configuration:configuration-forge-${minecraft_version}:${configuration_version}")

    // lombok
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'

    // Mixin
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

}

tasks.named('processResources', ProcessResources).configure {
    var properties = [
            "mod_license": mod_license,
            "mod_id": mod_id,
            "version": version,
            "mod_name": mod_name,
            "mod_url": mod_url,
            "mod_author": mod_author,
            "forge_version": forge_version.split("\\.")[0], // only specify major version of forge
            "minecraft_version": minecraft_version,
            "gtceu_version": gtceu_version,
            "typeomegalib_version": typeomegalib_version,
            "integration_mandatory": project.findProperty('typeOmegaDevOptionalDependencies') == 'true' ? 'false' : 'true',
    ]
    inputs.properties(properties)

    filesMatching("META-INF/mods.toml") {
        expand properties + [project: project]
    }
}

// The mixin config is declared through the manifest only (src/main/resources/META-INF/MANIFEST.MF in dev, the jar
// manifest in production). A --mixin.config run argument is read before the mod folder is mounted and fails in dev.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
}

// EN: The dev mod folder reads its manifest from the classes folder, not from resources, so without this copy no
// typeomega mixin was applied in runData, runGameTestServer or runClient.
// PT: A pasta do mod em dev lê o manifest da pasta de classes, não da de recursos; sem esta cópia nenhum mixin do
// typeomega era aplicado no runData, runGameTestServer ou runClient.
// ZH: 开发环境的模组文件夹从 classes 目录而非 resources 目录读取清单；没有这次复制，runData、runGameTestServer
// 和 runClient 中不会应用任何 typeomega mixin。
tasks.named('compileJava', JavaCompile).configure {
    doLast {
        copy {
            from 'src/main/resources/META-INF/MANIFEST.MF'
            into destinationDirectory.dir('META-INF')
        }
    }
}

tasks.named('jar', Jar).configure {
    manifest.attributes('MixinConfigs': "${mod_id}.mixins.json")
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    options.encoding = "UTF-8"
    options.release.set(17)
}
