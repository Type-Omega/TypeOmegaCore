modLoader = "javafml"
loaderVersion = "[47,)"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    displayURL = "${mod_url}"
    logoFile = "assets/typeomega/textures/logo.png"
    authors="${mod_author}"
    description = '''
Core mod of the Type Omega modpack: materials, processing chains, megastructures and progression on top of GTCEu Modern.
'''

    [[dependencies.${mod_id}]]
        modId = "forge"
        mandatory = true
        versionRange = "[${forge_version},)"
        ordering = "NONE"
        side = "BOTH"
    [[dependencies.${mod_id}]]
        modId = "minecraft"
        mandatory = true
        versionRange = "[${minecraft_version}]"
        ordering = "NONE"
        side = "BOTH"
    [[dependencies.${mod_id}]]
        modId = "gtceu"
        mandatory = true
        versionRange = "[${gtceu_version},8.0.0)"
        ordering = "AFTER"
        side = "BOTH"
    [[dependencies.${mod_id}]]
        modId = "ae2"
        mandatory = ${integration_mandatory}
        versionRange = "[15,16)"
        ordering = "AFTER"
        side = "BOTH"

    [[dependencies.${mod_id}]]
        modId = "expatternprovider"
        mandatory = ${integration_mandatory}
        versionRange = "*"
        ordering = "AFTER"
        side = "BOTH"

    [[dependencies.${mod_id}]]
        modId = "gtna"
        mandatory = ${integration_mandatory}
        versionRange = "[0.5.3,)"
        ordering = "AFTER"
        side = "BOTH"

    [[dependencies.${mod_id}]]
        modId = "typeomegalib"
        mandatory = true
        versionRange = "[${gtialib_version},)"
        ordering = "AFTER"
        side = "BOTH"

    # Optional: loaded after Productive Bees so GTIA's data turns its nests off (GTIA-D-259).
    [[dependencies.${mod_id}]]
        modId = "productivebees"
        mandatory = false
        versionRange = "*"
        ordering = "AFTER"
        side = "BOTH"
